<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists用データ変換ツール - SEMICON 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #343a40;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .info-box ul {
            margin-left: 20px;
            color: #495057;
            line-height: 1.8;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 15px;
        }

        .button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .button-success {
            background: #28a745;
        }

        .button-success:hover {
            background: #218838;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .preview {
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #dee2e6;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #343a40;
            color: white;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .star {
            color: gold;
            font-size: 18px;
        }

        .priority-S {
            font-weight: bold;
            color: #d4af37;
        }

        .priority-A {
            font-weight: bold;
            color: #2ecc71;
        }

        .priority-B {
            color: #3498db;
        }

        .priority-C {
            color: #95a5a6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Lists用データ変換ツール</h1>
        <div class="subtitle">SEMICON Southeast Asia 2026 - 企業マスタデータ作成</div>

        <div class="info-box">
            <h3>🎯 このツールの機能</h3>
            <ul>
                <li>既存のHTMLダッシュボードデータをMicrosoft Lists用のCSV/Excelに変換</li>
                <li>605社のデータを一括エクスポート</li>
                <li>Lists にそのままインポート可能な形式</li>
            </ul>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCompanies">-</div>
                <div class="stat-label">全企業数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="starCompanies">-</div>
                <div class="stat-label">注目企業 ⭐</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="priorityS">-</div>
                <div class="stat-label">優先度S</div>
            </div>
        </div>

        <div style="margin: 30px 0;">
            <button class="button" onclick="loadData()">📥 データ読み込み</button>
            <button class="button button-success" onclick="exportCSV()" id="exportBtn" disabled>📤 CSV
                エクスポート（Lists用）</button>
        </div>

        <div class="preview" id="preview" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>企業名</th>
                        <th>ブース番号</th>
                        <th>事前優先度</th>
                        <th>注目企業</th>
                        <th>概要</th>
                    </tr>
                </thead>
                <tbody id="previewBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="SEMICON_SEA_2026_共同調査ダッシュボード.html" type="text/javascript"></script>
    <script>
        let exhibitors = [];
        let listsData = [];

        async function loadData() {
            try {
                // HTMLダッシュボードファイルから読み込み
                const response = await fetch('SEMICON_SEA_2026_共同調査ダッシュボード.html');
                const htmlText = await response.text();

                // JavaScriptのexhibitors配列を抽出
                const match = htmlText.match(/const exhibitors = \[([\s\S]*?)\];/);
                if (match) {
                    exhibitors = JSON.parse('[' + match[1] + ']');
                    processData();
                } else {
                    alert('データの読み込みに失敗しました');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('ファイルの読み込みエラー: ' + error.message);
            }
        }

        function processData() {
            // Lists用データに変換
            listsData = exhibitors.map((item, index) => {
                // 注目企業から優先度を推定
                let priority = '未設定';
                if (item.star) {
                    // スター企業は優先度Sまたはの判定
                    // 詳細版mdファイルの★評価を参照（簡易版として全部S）
                    priority = 'S';
                }

                return {
                    ID: index + 1,
                    企業名: item.company,
                    ブース番号: item.booth,
                    事前優先度: priority,
                    注目企業: item.star ? 'はい' : 'いいえ',
                    概要: item.description || ''
                };
            });

            // 統計更新
            document.getElementById('totalCompanies').textContent = listsData.length;
            document.getElementById('starCompanies').textContent =
                listsData.filter(item => item.注目企業 === 'はい').length;
            document.getElementById('priorityS').textContent =
                listsData.filter(item => item.事前優先度 === 'S').length;

            // プレビュー表示
            displayPreview();
            document.getElementById('exportBtn').disabled = false;
        }

        function displayPreview() {
            const tbody = document.getElementById('previewBody');
            tbody.innerHTML = '';

            // 最初の50件を表示
            listsData.slice(0, 50).forEach(item => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${item.ID}</td>
                    <td>${item.企業名} ${item.注目企業 === 'はい' ? '<span class="star">⭐</span>' : ''}</td>
                    <td>${item.ブース番号}</td>
                    <td class="priority-${item.事前優先度}">${item.事前優先度}</td>
                    <td>${item.注目企業}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        ${item.概要}
                    </td>
                `;
            });

            document.getElementById('preview').style.display = 'block';
        }

        function exportCSV() {
            // CSVヘッダー
            const headers = ['ID', '企業名', 'ブース番号', '事前優先度', '注目企業', '概要'];

            // CSVデータ作成
            let csvContent = '\uFEFF'; // BOM for Excel UTF-8
            csvContent += headers.join(',') + '\n';

            listsData.forEach(item => {
                const row = [
                    item.ID,
                    `"${item.企業名.replace(/"/g, '""')}"`,
                    `"${item.ブース番号}"`,
                    item.事前優先度,
                    item.注目企業,
                    `"${item.概要.replace(/"/g, '""')}"`
                ];
                csvContent += row.join(',') + '\n';
            });

            // ダウンロード
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'SEMICON2026_企業マスタ_Lists用.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert('CSVファイルをダウンロードしました！\n\nMicrosoft Lists へのインポート手順:\n1. Lists を開く\n2. 「統合」→「Excel から」\n3. ダウンロードしたCSVファイルを選択\n4. 列マッピングを確認して「インポート」');
        }

        // ページ読み込み時に自動実行
        window.addEventListener('load', () => {
            setTimeout(loadData, 500);
        });
    </script>
</body>

</html>
