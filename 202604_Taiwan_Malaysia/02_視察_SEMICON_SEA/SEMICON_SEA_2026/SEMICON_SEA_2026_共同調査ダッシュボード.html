<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  
  :root {
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --bg-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --success: #10b981;
    --target: #8b5cf6;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;
    background: var(--bg-main); color: var(--text-main);
    min-height: 100vh; padding: 32px; -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1400px; margin: 0 auto;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  }

  .header { padding: 32px 40px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-main); margin-bottom: 8px; }
  .header .subtitle { font-size: 14px; color: var(--text-muted); }
  
  .header-actions { display: flex; gap: 12px; }
  .button {
    padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-main);
  }
  .button:hover { background: var(--bg-hover); border-color: var(--border-hover); }
  .button-primary { background: var(--text-main); color: #fff; border-color: var(--text-main); }
  .button-primary:hover { background: #334155; }
  .button-success { background: transparent; }
  
  .stats { display: flex; gap: 16px; margin-top: 24px; }
  .stat-card { border: 1px solid var(--border); padding: 16px 24px; border-radius: 8px; min-width: 120px; background: var(--bg-main); }
  .stat-number { font-size: 28px; font-weight: 600; color: var(--text-main); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.02em; text-transform: uppercase; font-weight: 500;}
  
  .controls { padding: 24px 40px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
  .control-row { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
  .control-row:last-child { margin-bottom: 0; }
  
  .search-box { flex: 1; min-width: 300px; }
  .search-box input, select {
    width: 100%; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-main); border-radius: 6px; font-size: 14px; outline: none; transition: all 0.2s;
  }
  .search-box input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  
  .checkbox-label {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text-main); transition: all 0.2s; font-weight: 500;
    background: var(--bg-card);
  }
  .checkbox-label:hover { background: var(--bg-hover); border-color: var(--border-hover); }
  .checkbox-label input { accent-color: var(--accent); cursor: pointer; }
  
  .alphabet-filter { display: flex; gap: 6px; flex-wrap: wrap; }
  .alphabet-btn {
    padding: 6px 12px; background: transparent; border: 1px solid transparent;
    border-radius: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; font-weight: 500;
  }
  .alphabet-btn:hover { color: var(--text-main); background: var(--bg-hover); }
  .alphabet-btn.active { color: var(--accent); background: #eff6ff; border-color: #bfdbfe; }
  
  .table-container { overflow-x: auto; max-height: calc(100vh - 350px); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { position: sticky; top: 0; z-index: 10; background: var(--bg-card); box-shadow: 0 1px 0 var(--border); }
  th { padding: 16px 20px; text-align: left; font-weight: 600; color: var(--text-main); cursor: pointer; background: var(--bg-main); }
  th:hover { color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s; cursor: pointer; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr.visited { background: #f0fdf4; }
  tbody tr.visited:hover { background: #dcfce7; }
  
  td { padding: 16px 20px; color: var(--text-muted); }
  .company-name { font-weight: 600; color: var(--text-main); }
  .booth { font-family: 'Courier New', monospace; font-size: 13px; background: var(--bg-main); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 8px; border: 1px solid transparent; font-weight: 600; }
  .status-visited { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .rating { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: var(--bg-main); border: 1px solid var(--border); font-weight: 600; }
  
  .no-results { text-align: center; padding: 60px; color: var(--text-muted); }
  
  /* Modal */
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); }
  .modal-content { background: var(--bg-card); border: 1px solid var(--border); margin: 40px auto; width: 90%; max-width: 800px; border-radius: 12px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); overflow: hidden; }
  .modal-header { padding: 24px 32px; background: var(--bg-main); border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 20px; font-weight: 600; color: var(--text-main); margin-bottom: 4px;}
  .close { float: right; font-size: 24px; color: var(--text-muted); cursor: pointer; }
  .close:hover { color: var(--text-main); }
  .modal-body { padding: 32px; max-height: calc(100vh - 200px); overflow-y: auto; }
  .info-section { background: var(--bg-main); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 24px; }
  .info-row { display: flex; margin-bottom: 12px; align-items: flex-start;}
  .info-label { width: 120px; color: var(--text-muted); font-size: 14px; font-weight: 500;}
  .info-value { flex: 1; font-size: 14px; color: var(--text-main); line-height: 1.5; }
  .form-section h3 { font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-weight: 600;}
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-main); font-weight: 500;}
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;}
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1);}
  .file-upload { border: 2px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; color: var(--text-muted); font-size: 14px; background: var(--bg-main); transition: all 0.2s;}
  .file-upload:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff;}
  .modal-footer { padding: 16px 32px; background: var(--bg-main); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
  .image-preview { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .image-preview-item { position: relative; width: 100px; height: 100px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
  .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .remove-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px; backdrop-filter: blur(2px);}

  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="header-title">
          <h1>🏭 SEMICON Southeast Asia 2026 共同調査ダッシュボード</h1>

        <div class="header-actions">

            インポート</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="totalCount">605</div>
          <div class="stat-label">全出展企業数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="visitedCount">0</div>
          <div class="stat-label">訪問済み</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="ratedCount">0</div>
          <div class="stat-label">評価済み</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="notableCount">51</div>
          <div class="stat-label">注目企業 🌟</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="displayCount">605</div>
          <div class="stat-label">表示中</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="control-row" style="justify-content: flex-start;">
        <div class="alphabet-filter" id="alphabetFilter">
          <span style="font-size: 12px; color: #6c757d; margin-right: 5px;">A-Z:</span>
        </div>
      </div>
      <div class="control-row">
        <div class="search-box">

        </div>
        <label class="checkbox-label" style="border-color: #667eea; background: rgba(102,126,234,0.1);">

        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="filterStar">
          <span>🌟 注目企業のみ</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="filterVisited">
          <span>✅ 訪問済みのみ</span>
        </label>
        <select id="filterRating">
          <option value="">評価: すべて</option>
          <option value="S">評価: S</option>
          <option value="A">評価: A</option>
          <option value="B">評価: B</option>
          <option value="C">評価: C</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table id="exhibitorTable">
        <thead>
          <tr>
            <th style="width: 50px;">状態</th>
            <th class="sortable" data-sort="company" style="width: 280px;">企業名</th>
            <th class="sortable" data-sort="booth" style="width: 100px;">ブース</th>
            <th style="width: 50px;">注目</th>
            <th style="width: 70px;">評価</th>
            <th style="width: 100px;">訪問者</th>
            <th>概要</th>

        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
      <div id="noResults" class="no-results" style="display: none;">
        <div style="font-size: 48px; margin-bottom: 15px;">🔍</div>
        <div>該当する企業が見つかりませんでした</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalCompanyName"></h2>
        <div id="modalBoothInfo"></div>
      </div>
      <div class="modal-body">
        <div class="info-section">
          <div class="info-row">
            <div class="info-label">企業名:</div>
            <div class="info-value" id="modalCompany"></div>
          </div>
          <div class="info-row">
            <div class="info-label">ブース番号:</div>
            <div class="info-value" id="modalBooth"></div>
          </div>
          <div class="info-row">
            <div class="info-label">概要:</div>
            <div class="info-value" id="modalDescription"></div>
          </div>
        </div>

        <div class="form-section">
          <h3>📝 調査記録</h3>

          <div class="form-group">
            <label>訪問日時</label>
            <input type="datetime-local" id="visitDate">
          </div>

          <div class="form-group">
            <label>訪問者名</label>
            <input type="text" id="visitorName" placeholder="例: 村上 武">
          </div>

          <div class="form-group">
            <label>総合評価</label>
            <select id="rating">
              <option value="">未評価</option>
              <option value="S">S - 最優先・必須フォロー</option>
              <option value="A">A - 重要・フォロー推奨</option>
              <option value="B">B - 有望・検討価値あり</option>
              <option value="C">C - 参考程度</option>
            </select>
          </div>

          <div class="form-group">
            <label>訪問メモ・所感</label>
            <textarea id="comments" placeholder="技術内容、製品特徴、担当者情報、商談内容など"></textarea>
          </div>

          <div class="form-group">
            <label>商談状況</label>
            <select id="status">
              <option value="">未定</option>
              <option value="follow">要フォローアップ</option>
              <option value="meeting">商談予定あり</option>
              <option value="quoted">見積依頼済み</option>
              <option value="no">対象外</option>
            </select>
          </div>

          <div class="form-group">
            <label>名刺・ブース写真</label>
            <div class="file-upload" onclick="document.getElementById('imageUpload').click()">
              <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
              <div>クリックして画像を追加</div>
              <div style="font-size: 12px; color: #6c757d; margin-top: 5px;">複数選択可能</div>
            </div>
            <input type="file" id="imageUpload" accept="image/*" multiple onchange="handleImageUpload(event)">
            <div class="image-preview" id="imagePreview"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="button button-secondary" onclick="closeModal()">キャンセル</button>
        <button class="button button-primary" onclick="saveRecord()">💾 保存</button>
      </div>
    </div>
  </div>

    const targetBooths = ["2637", "1410", "1232", "2484", "2317", "1598", "1264", "2118", "1360"];
    exhibitors.forEach(ex => {
      if (targetBooths.includes(ex.booth)) {
        ex.ai_target = true;
      }
    });

    let surveyData = {};
    let currentExhibitorId = null;
    let currentSort = { column: 'company', direction: 'asc' };
    let selectedAlphabet = ''; // '' means show all
    let filteredData = [...exhibitors];

    // Load saved data from localStorage
    function loadSurveyData() {
      const saved = localStorage.getItem('semicon_sea_2026_survey');
      if (saved) {
        surveyData = JSON.parse(saved);
      }
      updateStats();
    }

    // Save data to localStorage
    function saveSurveyData() {
      localStorage.setItem('semicon_sea_2026_survey', JSON.stringify(surveyData));
      updateStats();
    }

    // Update statistics
    function updateStats() {
      const visited = Object.values(surveyData).filter(d => d.visitDate).length;
      const rated = Object.values(surveyData).filter(d => d.rating).length;

      document.getElementById('visitedCount').textContent = visited;
      document.getElementById('ratedCount').textContent = rated;
    }

    // Render table
    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const noResults = document.getElementById('noResults');

      if (data.length === 0) {
        tbody.innerHTML = '';
        noResults.style.display = 'block';
        document.getElementById('displayCount').textContent = '0';
        return;
      }

      noResults.style.display = 'none';

      tbody.innerHTML = data.map((ex) => {
        const survey = surveyData[ex.id] || {};
        const visited = survey.visitDate ? 'visited' : '';
        const statusBadge = survey.visitDate ? '<span class="status-badge status-visited">訪問済</span>' : '';
        const rating = survey.rating ? `<span class="rating rating-${survey.rating}">${survey.rating}</span>` : '';
        const aiBadge = ex.ai_target ? '<span class="status-badge" style="background:#2563eb; color:white;">🎯 最優先</span>' : '';
        const visitor = survey.visitorName || '';

        return `
                    <tr class="${visited}" onclick="openModal(${ex.id})">
                        <td style="text-align: center;">${survey.visitDate ? '✅' : ''}</td>
                        <td class="company-name">${ex.company}${aiBadge}${statusBadge}</td>
                        <td><span class="booth">${ex.booth}</span></td>
                        <td style="text-align: center;">${ex.star ? '<span class="star">🌟</span>' : ''}</td>
                        <td>${rating}</td>
                        <td style="font-size: 12px;">${visitor}</td>
                        <td class="description" style="font-size: 13px;">${ex.description}</td>
                    </tr>
                `;
      }).join('');

      document.getElementById('displayCount').textContent = data.length;
    }

    // Filter data
    function filterData() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const showStarOnly = document.getElementById('filterStar').checked;
      const showVisitedOnly = document.getElementById('filterVisited').checked;
      const ratingFilter = document.getElementById('filterRating').value;
      const showAITarget = document.getElementById('filterAITarget').checked;

      filteredData = exhibitors.filter(ex => {
        const survey = surveyData[ex.id] || {};

        const matchesSearch = !searchTerm ||
          ex.company.toLowerCase().includes(searchTerm) ||
          ex.booth.toLowerCase().includes(searchTerm) ||
          ex.description.toLowerCase().includes(searchTerm) ||
          (survey.visitorName && survey.visitorName.toLowerCase().includes(searchTerm)) ||
          (survey.comments && survey.comments.toLowerCase().includes(searchTerm));

        const matchesStar = !showStarOnly || ex.star;
        const matchesVisited = !showVisitedOnly || survey.visitDate;
        const matchesRating = !ratingFilter || survey.rating === ratingFilter;
        const matchesAITarget = !showAITarget || ex.ai_target;

        // Alphabet filter
        const matchesAlphabet = !selectedAlphabet ||
          ex.company.toUpperCase().startsWith(selectedAlphabet);

        return matchesSearch && matchesStar && matchesVisited && matchesRating && matchesAlphabet && matchesAITarget;
      });

      sortData(currentSort.column, currentSort.direction, false);
    }

    // Sort data
    function sortData(column, direction = null, toggle = true) {
      if (toggle) {
        if (currentSort.column === column) {
          direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
          direction = 'asc';
        }
      } else {
        direction = direction || currentSort.direction;
      }

      currentSort = { column, direction };

      filteredData.sort((a, b) => {
        let aVal = a[column];
        let bVal = b[column];

        if (typeof aVal === 'string') {
          aVal = aVal.toLowerCase();
          bVal = bVal.toLowerCase();
        }

        if (direction === 'asc') {
          return aVal > bVal ? 1 : -1;
        } else {
          return aVal < bVal ? 1 : -1;
        }
      });

      renderTable(filteredData);
    }

    // Open modal
    function openModal(exhibitorId) {
      currentExhibitorId = exhibitorId;
      const ex = exhibitors.find(e => e.id === exhibitorId);
      const survey = surveyData[exhibitorId] || {};

      // Set basic info
      document.getElementById('modalCompanyName').textContent = ex.company;
      document.getElementById('modalBoothInfo').textContent = `ブース ${ex.booth}`;
      document.getElementById('modalCompany').textContent = ex.company;
      document.getElementById('modalBooth').textContent = ex.booth;
      document.getElementById('modalDescription').textContent = ex.description;

      // Set form values
      document.getElementById('visitDate').value = survey.visitDate || '';
      document.getElementById('visitorName').value = survey.visitorName || '';
      document.getElementById('rating').value = survey.rating || '';
      document.getElementById('comments').value = survey.comments || '';
      document.getElementById('status').value = survey.status || '';

      // Set images
      const imagePreview = document.getElementById('imagePreview');
      imagePreview.innerHTML = '';
      if (survey.images && survey.images.length > 0) {
        survey.images.forEach((imgData, idx) => {
          const div = document.createElement('div');
          div.className = 'image-preview-item';
          div.innerHTML = `
                        <img src="${imgData}" alt="Image ${idx + 1}">
                        <button class="remove-btn" onclick="removeImage(${idx})">×</button>
                    `;
          imagePreview.appendChild(div);
        });
      }

      document.getElementById('detailModal').style.display = 'block';
    }

    // Close modal
    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
      currentExhibitorId = null;
    }

    // Handle image upload
    function handleImageUpload(event) {
      const files = event.target.files;
      const survey = surveyData[currentExhibitorId] || {};

      if (!survey.images) {
        survey.images = [];
      }

      Array.from(files).forEach(file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function (e) {
            survey.images.push(e.target.result);
            surveyData[currentExhibitorId] = survey;

            // Update preview
            const imagePreview = document.getElementById('imagePreview');
            const div = document.createElement('div');
            div.className = 'image-preview-item';
            div.innerHTML = `
                            <img src="${e.target.result}" alt="Image">
                            <button class="remove-btn" onclick="removeImage(${survey.images.length - 1})">×</button>
                        `;
            imagePreview.appendChild(div);
          };
          reader.readAsDataURL(file);
        }
      });

      event.target.value = '';
    }

    // Remove image
    function removeImage(index) {
      const survey = surveyData[currentExhibitorId];
      if (survey && survey.images) {
        survey.images.splice(index, 1);
        openModal(currentExhibitorId); // Refresh modal
      }
    }

    // Save record
    function saveRecord() {
      const survey = {
        visitDate: document.getElementById('visitDate').value,
        visitorName: document.getElementById('visitorName').value,
        rating: document.getElementById('rating').value,
        comments: document.getElementById('comments').value,
        status: document.getElementById('status').value,
        images: surveyData[currentExhibitorId]?.images || [],
        lastUpdated: new Date().toISOString()
      };

      surveyData[currentExhibitorId] = survey;
      saveSurveyData();

      alert('💾 保存しました！');
      closeModal();
      filterData(); // Refresh table
    }

    // Export data
    function exportData() {
      const exportObj = {
        version: '1.0',
        exportDate: new Date().toISOString(),
        exhibitorData: exhibitors,
        surveyData: surveyData
      };

      const dataStr = JSON.stringify(exportObj, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);

      const link = document.createElement('a');
      link.href = url;
      link.download = `SEMICON_SEA_2026_調査データ_${new Date().toISOString().slice(0, 10)}.json`;
      link.click();

      URL.revokeObjectURL(url);
      alert('📥 データをエクスポートしました！');
    }

    // Import data
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);

          if (confirm('現在のデータに上書きしますか？（キャンセルでマージ）')) {
            surveyData = imported.surveyData;
          } else {
            // Merge data
            Object.assign(surveyData, imported.surveyData);
          }

          saveSurveyData();
          filterData();
          alert('📤 データをインポートしました！');
        } catch (err) {
          alert('❌ エラー: ファイルの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('filterStar').addEventListener('change', filterData);
    document.getElementById('filterVisited').addEventListener('change', filterData);
    document.getElementById('filterRating').addEventListener('change', filterData);
    document.getElementById('filterAITarget').addEventListener('change', filterData);

    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        sortData(th.dataset.sort);
      });
    });

    // Close modal on outside click
    window.onclick = function (event) {
      if (event.target == document.getElementById('detailModal')) {
        closeModal();
      }
    }

    // Initialize alphabet filter
    function initAlphabetFilter() {
      const container = document.getElementById('alphabetFilter');
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

      // Add alphabet buttons
      alphabet.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'alphabet-btn';
        btn.textContent = letter;
        btn.onclick = () => {
          if (selectedAlphabet === letter) {
            // Toggle off
            selectedAlphabet = '';
            document.querySelectorAll('.alphabet-btn').forEach(b => b.classList.remove('active'));
          } else {
            // Toggle on
            selectedAlphabet = letter;
            document.querySelectorAll('.alphabet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          }
          filterData();
        };
        container.appendChild(btn);
      });
    }

    // Initialize
    initAlphabetFilter();
    loadSurveyData();
    filterData();
  </script>
