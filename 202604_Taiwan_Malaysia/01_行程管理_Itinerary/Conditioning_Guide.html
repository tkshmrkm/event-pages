                            title: 'ポケットの完全クリア化',
                            tag: 'Speed',
                            content: 'スマホや小銭はすべて上着のポケットに入れておき、上着を脱ぐだけで検査を完了させる。',
                            check: false,
                            highlight: true
                        },
                        {
                            title: '入国準備：Visit Japan Web',
                            tag: 'Efficiency',
                            content: '出国前など、ネット環境が良い早い段階で入力を済ませる。現地での欠航・遅延で余裕がなくなる前に。',
                            check: false
                        },
                        {
                            title: '給水サバイバル',
                            tag: 'Health',
                            content: '保安検査通過後、空のボトルに給水。機内の乾燥から喉を保護。CAを呼ぶ回数を減らす。',
                            check: false
                        }
                    ]
                },
                {
                    id: 'inflight',
                    title: '究極のフライト',
                    icon: 'ph-moon-stars',
                    badge: 'Step 03: Recovery',
                    desc: '24時間を「移動」ではなく「回復時間」へ。睡眠を妨げるリスクを排除する。',
                    visual: 'tmpl-seat-map',
                    items: [
                        {
                            title: '座席戦略：「中央列の右通路側(G席)」',
                            tag: 'Logic',
                            content: '3-4-3配列のG席を死守。窓側通路(C)は奥の2人がバラバラに出るため、睡眠を何度も遮断される。',
                            check: false,
                            highlight: true
                        },
                        {
                            title: 'サバイバル・四種の神器',
                            tag: 'Essentials',
                            content: 'のど飴、厚手アイマスク、スリッパ、そして胃薬。これらを離陸前に手元に揃える。',
                            check: false
                        },
                        {
                            title: '24時間移動のリフレッシュ',
                            tag: 'Sanitation',
                            content: '長時間移動の途中で靴下を履き替える。足元の不快感を解消し、メンタルをリセット。',
                            check: false
                        }
                    ]
                },
                {
                    id: 'digital_infra',
                    title: 'デジタル・インフラ',
                    icon: 'ph-device-mobile',
                    badge: 'Step 04: Operation',
                    desc: 'インフラの「不条理」をアプリで攻略。DBの遅延は秒単位で追う。',
                    visual: 'tmpl-app-eco',
                    items: [
                        {
                            title: '決済ハブ：Revolut',
                            tag: 'Money',
                            content: '割り勘、現地ATM、ドイツDB、中国Alipay。JALカード等からのチャージと現金を使い分ける。',
                            check: false,
                            highlight: true
                        },
                        {
                            title: '通信：Airalo (eSIM)',
                            tag: 'Network',
                            content: '日本国内でアクティベートまで完了させる。着陸の瞬間にネットが繋がる状態を作る。',
                            check: false
                        },
                        {
                            title: '不確実性への対応：DB Navigator',
                            tag: 'Mobility',
                            content: 'ドイツ鉄道は時間通りに来ない。アプリをRevolutに紐付け、リアルタイムで代替ルートを確保。',
                            check: false
                        }
                    ]
                },
                {
                    id: 'local_return',
                    title: '現地・宿泊・帰宅',
                    icon: 'ph-house-line',
                    badge: 'Step 05: Mission Complete',
                    desc: '安全に「ただいま」を言うまでが仕事。',
                    items: [
                        {
                            title: 'ホテル戦略：公式サイト＋事前チェックイン',
                            tag: 'Stay',
                            content: 'Accor ＞ IHG ＞ Hiltonの順。予算2.5万円目安。事前チェックインで現地での待ち時間を削る。',
                            check: false
                        },
                        {
                            title: 'お土産のマイルール',
                            tag: 'Family',
                            content: '基本は現地スーパー。リクエスト（アンペルマン等）は空港等で確実に確保。',
                            check: false
                        },
                        {
                            title: '帰路のリカバリー',
                            tag: 'Recovery',
                            content: 'はるか京都駅から中書島まではタクシー。体力を温存し無事に「ただいま」を言う。',
                            check: false,
                            highlight: true
                        }
                    ]
                }
            ]
        };

        // ============================================================
        // STATE MANAGEMENT
        // ============================================================
        let currentPhaseIndex = 0;
        let checklistMode = false;

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const navContainer = document.getElementById('phase-nav');
        const contentArea = document.getElementById('content-area');
        const phaseTitle = document.getElementById('phase-title');
        const phaseBadge = document.getElementById('phase-badge');
        const phaseDesc = document.getElementById('phase-desc');
        const phaseIcon = document.getElementById('phase-icon');
        const phaseBgIcon = document.getElementById('phase-bg-icon');
        const toggleBtn = document.getElementById('toggle-checklist-mode');
        const progressText = document.getElementById('progress-text');

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function init() {
            renderNav();
            renderContent(0);
            renderCharts();
            updateProgress();

            // Toggle checklist mode
            toggleBtn.addEventListener('click', toggleChecklistMode);
        }

        // ============================================================
        // NAVIGATION RENDERING
        // ============================================================
        function renderNav() {
            navContainer.innerHTML = murakamiData.phases.map((phase, index) => `
                <button onclick="switchPhase(${index})" 
                    class="nav-item w-full text-left px-5 py-4 border-l-4 transition-all hover:bg-slate-50 flex items-center gap-4 rounded-lg my-1
                    ${index === currentPhaseIndex ? 'tab-active font-black' : 'border-transparent text-slate-600 hover:text-slate-900'}">
                    <div class="flex-shrink-0 text-2xl">
                        <i class="ph-fill ${phase.icon} ${index === currentPhaseIndex ? 'text-brand-600' : 'text-slate-400'}"></i>
                    </div>
                    <div class="text-sm font-bold">${phase.title}</div>
                </button>
            `).join('');
        }

        // ============================================================
        // PHASE SWITCHING
        // ============================================================
        window.switchPhase = (index) => {
            currentPhaseIndex = index;
            renderNav();
            renderContent(index);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ============================================================
        // CONTENT RENDERING
        // ============================================================
        function renderContent(index) {
            const phase = murakamiData.phases[index];

            // Update header
            phaseTitle.textContent = phase.title;
            phaseBadge.textContent = phase.badge;
            phaseDesc.textContent = phase.desc;
            phaseIcon.className = `ph-fill ${phase.icon} text-5xl text-brand-600`;
            phaseBgIcon.className = `ph-fill ${phase.icon}`;

            let html = '';

            // Add visual if present and not in checklist mode
            if (phase.visual && !checklistMode) {
                html += `<div class="animate-fade-in mb-6">${document.getElementById(phase.visual).innerHTML}</div>`;
            }

            // Render items
            html += phase.items.map((item, i) => `
                <div class="group bg-white rounded-2xl border-2 ${item.highlight ? 'border-accent-300 shadow-lg shadow-accent-100' : 'border-slate-200'} p-6 sm:p-8 hover:shadow-2xl transition-all duration-300 animate-fade-in cursor-pointer relative overflow-hidden card-hover" 
                     onclick="toggleCheck('${phase.id}', ${i})"
                     style="animation-delay: ${i * 0.05}s">
                    
                    ${item.highlight ? '<div class="absolute top-0 right-0 bg-gradient-to-r from-accent-500 to-accent-600 text-white px-4 py-1.5 text-[9px] font-black uppercase tracking-wider rounded-bl-xl shadow-lg">Essential</div>' : ''}
                    
                    <div class="flex items-start gap-5">
                        <div class="mt-1 flex-shrink-0">
                            ${checklistMode ? `
                                <div class="w-9 h-9 rounded-xl border-3 flex items-center justify-center transition-all duration-300 shadow-sm ${item.check ? 'bg-gradient-brand border-brand-600' : 'border-slate-300 group-hover:border-brand-400'}">
                                    ${item.check ? '<i class="ph-fill ph-check text-white text-lg font-bold"></i>' : ''}
                                </div>
                            ` : `
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center text-slate-600 font-black text-sm group-hover:from-brand-500 group-hover:to-brand-600 group-hover:text-white transition-all duration-300 shadow-sm">
                                    ${(i + 1).toString().padStart(2, '0')}
                                </div>
                            `}
                        </div>
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 shadow-sm">${item.tag}</span>
                            </div>
                            <h3 class="text-xl sm:text-2xl font-black text-slate-900 mb-3 tracking-tight ${item.check && checklistMode ? 'line-through text-slate-400' : ''}">
                                ${item.title}
                            </h3>
                            <p class="text-slate-600 text-sm sm:text-base leading-relaxed font-medium ${item.check && checklistMode ? 'text-slate-400' : ''}">
                                ${item.content}
                            </p>
                        </div>
                    </div>
                </div>
            `).join('');

            contentArea.innerHTML = html;
        }

        // ============================================================
        // CHECKLIST TOGGLE
        // ============================================================
        function toggleChecklistMode() {
            checklistMode = !checklistMode;

            // Update button appearance
            toggleBtn.classList.toggle('bg-brand-100');
            toggleBtn.classList.toggle('border-brand-500');
            toggleBtn.classList.toggle('text-brand-700');

            // Update icon and text
            const icon = toggleBtn.querySelector('i');
            const text = toggleBtn.querySelector('span');

            if (checklistMode) {
                icon.className = 'ph-fill ph-book-open-text text-lg';
                text.textContent = 'ガイドモード';
            } else {
                icon.className = 'ph-fill ph-list-checks text-lg';
                text.textContent = 'チェックリスト';
            }

            renderContent(currentPhaseIndex);
        }

        // ============================================================
        // ITEM CHECK TOGGLE
        // ============================================================
        window.toggleCheck = (phaseId, itemIndex) => {
            const phase = murakamiData.phases.find(p => p.id === phaseId);
            if (phase) {
                phase.items[itemIndex].check = !phase.items[itemIndex].check;
                updateProgress();
                if (checklistMode) {
                    renderContent(currentPhaseIndex);
                }
            }
        };

        // ============================================================
        // PROGRESS UPDATE
        // ============================================================
        function updateProgress() {
            let total = 0;
            let completed = 0;

            murakamiData.phases.forEach(phase => {
                total += phase.items.length;
                completed += phase.items.filter(item => item.check).length;
            });

            progressText.textContent = `完了: ${completed}/${total}`;
        }

        // ============================================================
        // CHART RENDERING
        // ============================================================
        function renderCharts() {
            const ctx = document.getElementById('performanceChart').getContext('2d');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['出発', '空港', '機内1', '機内2', '到着', '現地', '帰宅'],
                    datasets: [
                        {
                            label: '村上流',
                            data: [100, 95, 90, 85, 80, 90, 95],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#10b981',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        },
                        {
                            label: '一般',
                            data: [90, 70, 50, 30, 20, 40, 30],
                            borderColor: '#cbd5e1',
                            backgroundColor: 'rgba(203, 213, 225, 0.05)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.4,
                            fill: true,
                            pointRadius: 3,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#cbd5e1',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: {
                                size: 13,
                                weight: 'bold'
                            },
                            bodyFont: {
                                size: 12
                            },
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            display: true,
                            min: 0,
                            max: 100,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)',
                                drawBorder: false
                            },
                            ticks: {
                                font: {
                                    size: 10
                                },
                                color: '#64748b',
                                callback: function (value) {
                                    return value + '%';
                                }
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 9,
                                    weight: '600'
                                },
                                color: '#475569'
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // ============================================================
        // START APPLICATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
