<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出張旅程 TW-MY 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Noto Sans JP', sans-serif;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .checkin-box {
            color: #1f2937;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transport-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .transport-table th {
            background: #f3f4f6;
            padding: 8px;
            font-weight: 600;
            text-align: left;
            border-bottom: 2px solid #e5e7eb;
        }

        .transport-table td {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .recommended {
            background: #dbeafe;
        }

        .risk-low {
            color: #10b981;
        }

        .risk-mid {
            color: #f59e0b;
        }

        .risk-high {
            color: #ef4444;
        }
    </style>
</head>

<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-gray-800 text-white sticky top-0 z-40 shadow">
        <div class="max-w-3xl mx-auto p-4">
            <h1 class="text-xl font-bold">出張旅程 TW-MY 2026</h1>
            <p class="text-sm text-blue-100">4/28 (火) - 5/7 (木)</p>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-3xl mx-auto p-4 pb-24">

        <!-- TAB 1: 旅程 -->
        <div id="tab-itinerary" class="tab-content active space-y-6">
            <!-- Content will be generated by JavaScript -->
        </div>

        <!-- TAB 2: 準備 -->
        <div id="tab-prep" class="tab-content space-y-4">
            <!-- Content will be generated by JavaScript -->
        </div>

        <!-- TAB 3: 家族 -->
        <div id="tab-family" class="tab-content">
            <!-- Content will be generated by JavaScript -->
        </div>

        <!-- TAB 4: イミグレ -->
        <div id="tab-immigre" class="tab-content">
            <!-- Content will be generated by JavaScript -->
        </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">
        <div class="max-w-3xl mx-auto flex">
            <button onclick="switchTab('itinerary')" class="nav-btn active flex-1 flex flex-col items-center py-3"
                data-target="itinerary">
                <i class="fas fa-route text-xl mb-1"></i>
                <span class="text-xs font-semibold">旅程</span>
            </button>
            <button onclick="switchTab('prep')" class="nav-btn flex-1 flex flex-col items-center py-3"
                data-target="prep">
                <i class="fas fa-clipboard-check text-xl mb-1"></i>
                <span class="text-xs font-semibold">準備</span>
            </button>
            <button onclick="switchTab('family')" class="nav-btn flex-1 flex flex-col items-center py-3"
                data-target="family">
                <i class="fas fa-users text-xl mb-1"></i>
                <span class="text-xs font-semibold">家族</span>
            </button>
            <button onclick="switchTab('immigre')" class="nav-btn flex-1 flex flex-col items-center py-3"
                data-target="immigre">
                <i class="fas fa-passport text-xl mb-1"></i>
                <span class="text-xs font-semibold">イミグレ</span>
            </button>
        </div>
    </nav>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
