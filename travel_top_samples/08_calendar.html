<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 Calendar</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#172033; --muted:#6b7280; --line:#e7eaf0;
  --blue:#315efb; --green:#12a66a; --amber:#e69b16; --red:#d64b4b; --shadow:0 10px 30px rgba(24,32,51,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.h1{font-size:34px;font-weight:850;line-height:1.1}
.h2{font-size:20px;font-weight:800}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:#172033;border:1px solid var(--line)}
.progress{height:8px;border-radius:999px;background:#edf0f6;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#315efb,#6b8cff)}
.tag{display:inline-flex;padding:6px 9px;border-radius:8px;background:#f0f3ff;color:#315efb;font-size:12px;font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.back{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
@media(max-width:800px){.shell{padding:14px}.h1{font-size:28px}}

.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week span{text-align:center;color:var(--muted);font-size:12px;padding:6px}.day{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.evt{margin-top:8px;background:#eef3ff;color:#315efb;border-radius:7px;padding:5px;font-size:11px;font-weight:700}</style></head>
<body>
<div class="shell">

<div class="topbar"><div><div class="brand">TRAVEL CALENDAR</div><div class="sub">September 2026</div></div><span class="pill">Month view</span></div>
<div class="card" style="padding:18px">
  <div class="week"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  <div class="calendar"><div class="day"><b>1</b></div><div class="day"><b>2</b></div><div class="day"><b>3</b></div><div class="day"><b>4</b></div><div class="day"><b>5</b></div><div class="day"><b>6</b></div><div class="day"><b>7</b><div class="evt">✈ Stuttgart</div></div><div class="day"><b>8</b></div><div class="day"><b>9</b></div><div class="day"><b>10</b></div><div class="day"><b>11</b></div><div class="day"><b>12</b></div><div class="day"><b>13</b><div class="evt">Summit</div></div><div class="day"><b>14</b></div><div class="day"><b>15</b></div><div class="day"><b>16</b></div><div class="day"><b>17</b></div><div class="day"><b>18</b></div><div class="day"><b>19</b></div><div class="day"><b>20</b></div><div class="day"><b>21</b></div><div class="day"><b>22</b></div><div class="day"><b>23</b></div><div class="day"><b>24</b></div><div class="day"><b>25</b></div><div class="day"><b>26</b></div><div class="day"><b>27</b></div><div class="day"><b>28</b></div><div class="day"><b>29</b></div><div class="day"><b>30</b></div><div class="day"><b>31</b></div></div>
</div>
<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:18px">
 <div class="card" style="padding:16px"><b>Sep 7</b><div class="small">Departure</div></div>
 <div class="card" style="padding:16px"><b>Sep 9–11</b><div class="small">Humanoid Summit</div></div>
 <div class="card" style="padding:16px"><b>Sep 14</b><div class="small">Return</div></div>
</div>

</div>
<a class="back" href="index.html">← 10案一覧</a>
</body></html>
