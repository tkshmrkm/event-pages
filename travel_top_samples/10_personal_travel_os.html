<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 Personal Travel OS</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#172033; --muted:#6b7280; --line:#e7eaf0;
  --blue:#315efb; --green:#12a66a; --amber:#e69b16; --red:#d64b4b; --shadow:0 10px 30px rgba(24,32,51,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.h1{font-size:34px;font-weight:850;line-height:1.1}
.h2{font-size:20px;font-weight:800}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:#172033;border:1px solid var(--line)}
.progress{height:8px;border-radius:999px;background:#edf0f6;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#315efb,#6b8cff)}
.tag{display:inline-flex;padding:6px 9px;border-radius:8px;background:#f0f3ff;color:#315efb;font-size:12px;font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.back{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
@media(max-width:800px){.shell{padding:14px}.h1{font-size:28px}}

.osgrid{grid-template-columns:repeat(3,1fr)}.module{padding:22px;min-height:145px}.big{grid-column:span 2}.wide{grid-column:span 2}.ask{margin-top:16px;border:1px solid var(--line);background:#f8f9fc;border-radius:12px;padding:14px;display:flex;justify-content:space-between}.ask span{font-size:20px}</style></head>
<body>
<div class="shell">

<div class="topbar"><div><div class="brand">PERSONAL TRAVEL OS</div><div class="sub">Trips · Tasks · Reservations · Documents · Ideas</div></div><span class="pill">OS v1</span></div>
<div class="grid osgrid">
  <div class="card module big"><div class="small">NEXT TRIP</div><div class="h1">🇩🇪 Stuttgart</div><div>Sep 7–14</div><div class="progress" style="margin-top:16px"><span style="width:72%"></span></div></div>
  <div class="card module"><div class="small">TASKS</div><div class="h2">7 open</div><div>2 need attention</div></div>
  <div class="card module"><div class="small">RESERVATIONS</div><div class="h2">9 saved</div><div>Flights · Hotels · Rail</div></div>
  <div class="card module"><div class="small">DOCUMENTS</div><div class="h2">12 files</div><div>Tickets · PDFs · Receipts</div></div>
  <div class="card module"><div class="small">IDEAS</div><div class="h2">2027</div><div>RSS · ICRA · Automatica</div></div>
  <div class="card module wide"><div class="small">ASK / PLAN</div><div class="ask">次の出張でまだ決めていないことは？ <span>→</span></div></div>
</div>

</div>
<a class="back" href="index.html">← 10案一覧</a>
</body></html>
