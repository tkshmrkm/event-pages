<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 Mission Control</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#172033; --muted:#6b7280; --line:#e7eaf0;
  --blue:#315efb; --green:#12a66a; --amber:#e69b16; --red:#d64b4b; --shadow:0 10px 30px rgba(24,32,51,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.h1{font-size:34px;font-weight:850;line-height:1.1}
.h2{font-size:20px;font-weight:800}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:#172033;border:1px solid var(--line)}
.progress{height:8px;border-radius:999px;background:#edf0f6;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#315efb,#6b8cff)}
.tag{display:inline-flex;padding:6px 9px;border-radius:8px;background:#f0f3ff;color:#315efb;font-size:12px;font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.back{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
@media(max-width:800px){.shell{padding:14px}.h1{font-size:28px}}

.metric{padding:14px;border:1px solid var(--line);border-radius:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:5px;color:#15915f}.metric.warn b{color:#d48913}.decision{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.decision span{color:var(--muted)}.decision button{border:0;background:#172033;color:white;border-radius:9px;padding:8px 12px}</style></head>
<body>
<div class="shell">

<div class="topbar"><div><div class="brand">MISSION CONTROL</div><div class="sub">Decision-oriented travel planning</div></div><span class="pill">Status: Green</span></div>
<div class="grid" style="grid-template-columns:1.4fr .8fr">
<section class="card" style="padding:24px">
  <div class="small">ACTIVE MISSION</div><div class="h1">STUTTGART</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px">
    <div class="metric"><span>Flight</span><b>LOCKED</b></div>
    <div class="metric"><span>Hotel</span><b>LOCKED</b></div>
    <div class="metric warn"><span>Local</span><b>OPEN</b></div>
    <div class="metric warn"><span>Event</span><b>OPEN</b></div>
  </div>
</section>
<aside class="card" style="padding:22px"><div class="small">NEXT DEADLINE</div><div class="h2" style="margin-top:8px">Mainz Ticket</div><div style="font-size:36px;font-weight:900;margin-top:6px">TODAY</div></aside>
</div>
<div class="card" style="padding:22px;margin-top:18px"><div class="h2">Decision queue</div>
<div class="decision"><b>ICE vs Flight</b><span>FRA → STR</span><button>Decide</button></div>
<div class="decision"><b>Hotel choice</b><span>Amsterdam</span><button>Compare</button></div>
</div>

</div>
<a class="back" href="index.html">← 10案一覧</a>
</body></html>
