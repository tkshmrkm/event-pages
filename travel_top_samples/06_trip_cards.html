<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 Trip Cards</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#172033; --muted:#6b7280; --line:#e7eaf0;
  --blue:#315efb; --green:#12a66a; --amber:#e69b16; --red:#d64b4b; --shadow:0 10px 30px rgba(24,32,51,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.h1{font-size:34px;font-weight:850;line-height:1.1}
.h2{font-size:20px;font-weight:800}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:#172033;border:1px solid var(--line)}
.progress{height:8px;border-radius:999px;background:#edf0f6;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#315efb,#6b8cff)}
.tag{display:inline-flex;padding:6px 9px;border-radius:8px;background:#f0f3ff;color:#315efb;font-size:12px;font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.back{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
@media(max-width:800px){.shell{padding:14px}.h1{font-size:28px}}

.tripcard{overflow:hidden}.hero{height:160px;color:white;padding:20px;display:flex;flex-direction:column;justify-content:space-between;font-size:30px;font-weight:900}.hero span{font-size:36px}</style></head>
<body>
<div class="shell">

<div class="topbar"><div><div class="brand">MY TRIPS</div><div class="sub">Visual card library</div></div><span class="pill">Cards</span></div>
<div class="grid" style="grid-template-columns:repeat(2,1fr)">

    <div class="tripcard card">
      <div class="hero" style="background:linear-gradient(135deg,#5B7CFF,#172033)"><span>🇩🇪</span><div>Stuttgart</div></div>
      <div style="padding:18px"><div class="small">Sep 7–14</div><div style="font-weight:800;margin-top:4px">Humanoid Robots Summit Europe</div>
      <div style="display:flex;gap:8px;margin-top:16px"><span class="pill">Plan</span><span class="pill">Stay</span><span class="pill">Share</span></div></div>
    </div>
    <div class="tripcard card">
      <div class="hero" style="background:linear-gradient(135deg,#FF7A59,#172033)"><span>🇳🇱</span><div>Amsterdam</div></div>
      <div style="padding:18px"><div class="small">Oct 19–20</div><div style="font-weight:800;margin-top:4px">TechEX Europe</div>
      <div style="display:flex;gap:8px;margin-top:16px"><span class="pill">Plan</span><span class="pill">Stay</span><span class="pill">Share</span></div></div>
    </div>
    <div class="tripcard card">
      <div class="hero" style="background:linear-gradient(135deg,#1DBF73,#172033)"><span>🇩🇪</span><div>Hannover</div></div>
      <div style="padding:18px"><div class="small">Oct 21–24</div><div style="font-weight:800;margin-top:4px">EuroBLECH 2026</div>
      <div style="display:flex;gap:8px;margin-top:16px"><span class="pill">Plan</span><span class="pill">Stay</span><span class="pill">Share</span></div></div>
    </div>
    <div class="tripcard card">
      <div class="hero" style="background:linear-gradient(135deg,#9B6BFF,#172033)"><span>🇬🇷</span><div>Athens</div></div>
      <div style="padding:18px"><div class="small">Jul 2027</div><div style="font-weight:800;margin-top:4px">RSS 2027</div>
      <div style="display:flex;gap:8px;margin-top:16px"><span class="pill">Plan</span><span class="pill">Stay</span><span class="pill">Share</span></div></div>
    </div></div>
</div>
<a class="back" href="index.html">← 10案一覧</a>
</body></html>
