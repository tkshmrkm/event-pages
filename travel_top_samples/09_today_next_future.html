<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 Today Next Future</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#172033; --muted:#6b7280; --line:#e7eaf0;
  --blue:#315efb; --green:#12a66a; --amber:#e69b16; --red:#d64b4b; --shadow:0 10px 30px rgba(24,32,51,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.h1{font-size:34px;font-weight:850;line-height:1.1}
.h2{font-size:20px;font-weight:800}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:#172033;border:1px solid var(--line)}
.progress{height:8px;border-radius:999px;background:#edf0f6;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#315efb,#6b8cff)}
.tag{display:inline-flex;padding:6px 9px;border-radius:8px;background:#f0f3ff;color:#315efb;font-size:12px;font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.back{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
@media(max-width:800px){.shell{padding:14px}.h1{font-size:28px}}

.today{background:linear-gradient(135deg,#172033,#315efb);color:white}.today .small{color:#d9e2ff}.today .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:white}</style></head>
<body>
<div class="shell">

<div class="topbar"><div><div class="brand">TODAY → NEXT → FUTURE</div><div class="sub">Daily-use travel home</div></div><span class="pill">Sunday</span></div>
<section class="card today" style="padding:24px">
 <div class="small">TODAY</div><div class="h1" style="margin-top:6px">2 things to do</div>
 <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px"><span class="pill">🎫 Check Mainz ticket</span><span class="pill">🚆 Compare FRA → STR</span></div>
</section>
<div class="grid" style="grid-template-columns:1.1fr .9fr;margin-top:18px">
  <section class="card" style="padding:22px"><div class="small">NEXT</div><div class="h2">🇩🇪 Stuttgart</div><div class="small">Sep 7–14 · 72% ready</div><div class="progress" style="margin-top:12px"><span style="width:72%"></span></div></section>
  <section class="card" style="padding:22px"><div class="small">AFTER THAT</div><div><b>🇳🇱 Amsterdam</b></div><div><b>🇩🇪 Hannover</b></div></section>
</div>
<div class="card" style="padding:22px;margin-top:18px"><div class="small">FUTURE IDEAS</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><span class="pill">RSS 2027 Athens</span><span class="pill">ICRA 2027 Seoul</span><span class="pill">Automatica</span></div></div>

</div>
<a class="back" href="index.html">← 10案一覧</a>
</body></html>
