            justify-content: space-between;
            align-items: center;

        .bar { width: 4px; height: 12px; border-radius: 1px; display: inline-block; }
        
        .controls { display: flex; gap: 5px; }
        button {
            padding: 4px 10px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            color: #475569;
            font-weight: 500;
        }
        button:hover { background: #f1f5f9; border-color: #94a3b8; }

        .timeline-container {

            overflow: auto;
            position: relative;
            background: white;
            scroll-behavior: smooth;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 1400px;
            table-layout: fixed;
        }

            top: 0;
            z-index: 50;
            background: #f8fafc;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);

            border-bottom: 1px solid #e2e8f0;

        @keyframes flash { 0% { background-color: #fef08a; } 100% { background-color: transparent; } }

            border-right: 1px solid #f1f5f9;
            border-bottom: 1px dashed #e2e8f0;
            vertical-align: top;
            padding: 0;

            border-left-width: 5px;
            border-left-style: solid;

            line-height: 1.2;

            box-shadow: none;

        .evt-title { font-weight: 700; margin-bottom: 1px; font-size: 0.75rem; }
        .evt-desc { font-size: 0.65rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .night-jst { background-image: radial-gradient(#bfdbfe 1px, transparent 1px); background-size: 10px 10px; opacity: 0.5; }

    function renderTimelineRobust() {
        const tbody = document.getElementById('tbody');
        let current = new Date(START_DATE);
        
        while (current <= END_DATE) {
            const tr = document.createElement('tr');
            const dateStr = current.toISOString().split('T')[0];
            tr.setAttribute('data-date', dateStr);

            const jstHour = current.getHours();
            const edtDateObj = new Date(current.getTime() - 13 * 60 * 60 * 1000);
            const cestDateObj = new Date(current.getTime() - 7 * 60 * 60 * 1000);
            
            [
                {h: jstHour, cls:'jst', l: `${current.getMonth()+1}/${current.getDate()}`},
                {h: edtDateObj.getHours(), cls:'edt', l: `${edtDateObj.getMonth()+1}/${edtDateObj.getDate()}`},
                {h: cestDateObj.getHours(), cls:'cest', l: `${cestDateObj.getMonth()+1}/${cestDateObj.getDate()}`}
            ].forEach(t => {
                const td = document.createElement('td');
                td.className = `td-time td-${t.cls}`;
                if(t.h===0) td.classList.add('new-day');
                if(t.h >= 22 || t.h <= 7) td.classList.add(`night-${t.cls}`);
                td.innerHTML = `<span class="date-label">${t.l}</span>${pad(t.h)}:00`;
                tr.appendChild(td);
            });

            ['m', 's', 'mi', 'd'].forEach(p => {
                const nextHour = new Date(current.getTime() + 60*60*1000);
                
                const slotEvents = events.filter(e => {
                    if (!e.who.includes(p)) return false;
                    const eStart = new Date(e.start);
                    return eStart >= current && eStart < nextHour;
                });

                const td = document.createElement('td');
                if(jstHour===0) td.classList.add('new-day');
                td.style.position = 'relative';

                slotEvents.forEach(event => {
                    const eStart = new Date(event.start);
                    const eEnd = new Date(event.end);
                    
                    const offsetMinutes = eStart.getMinutes();
                    const topPx = (offsetMinutes / 60) * ROW_HEIGHT;
                    
                    const diffMs = eEnd.getTime() - eStart.getTime();
                    const durationHours = diffMs / (1000 * 60 * 60);
                    const heightPx = durationHours * ROW_HEIGHT;

                    const div = document.createElement('div');
                    div.className = `event evt-${event.tz} type-${event.type}`;
                    div.style.top = `${topPx + 1}px`;
                    div.style.height = `${heightPx - 3}px`;
                    
                    let displayStart = eStart;
                    let displayEnd = eEnd;
                    
                    if (event.tz === TZ_EDT) {
                        displayStart = new Date(eStart.getTime() - 13*3600000);
                        displayEnd = new Date(eEnd.getTime() - 13*3600000);
                    } else if (event.tz === TZ_CEST) {
                        displayStart = new Date(eStart.getTime() - 7*3600000);
                        displayEnd = new Date(eEnd.getTime() - 7*3600000);
                    }

                    const sStr = `${pad(displayStart.getHours())}:${pad(displayStart.getMinutes())}`;
                    const eStr = `${pad(displayEnd.getHours())}:${pad(displayEnd.getMinutes())}`;

                    let content = `
                        <span class="evt-time">${sStr}-${eStr}</span>
                        <span class="evt-title">${event.title}</span>
                    `;
                    let desc = event.desc;
                    if(desc.includes('機内食')) {
                        desc = desc.replace('機内食', '<span style="font-size:1.1em">🍴</span>');
                    }
                    content += `<span class="evt-desc">${desc}</span>`;
                    
                    div.innerHTML = content;
                    td.appendChild(div);
                });
                
                tr.appendChild(td);
            });
            
            tbody.appendChild(tr);
            current = new Date(current.getTime() + 60 * 60 * 1000);
        }
    }

    function pad(n) { return n < 10 ? '0'+n : n; }

    function scrollToDate(dateStr) {
        const rows = document.querySelectorAll('tr');
        for (let tr of rows) {
            if (tr.getAttribute('data-date') === dateStr) {
                tr.scrollIntoView({behavior: 'smooth', block: 'start'});
                tr.classList.remove('flash-highlight');
                void tr.offsetWidth;
                tr.classList.add('flash-highlight');
                return;
            }
        }
    }

    renderTimelineRobust();
